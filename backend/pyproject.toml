[project]
name = "neurosurgery-ai-academy-backend"
version = "0.1.0"
description = "Prof. Ali Kotb Neurosurgery AI Academy - backend (Phase 1: Local Reference Library)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
